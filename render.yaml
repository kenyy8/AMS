services:
  - type: web
    name: ams-class-demo
    runtime: node
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTED_DEMO
        value: "true"
      - key: NODE_VERSION
        value: 24.22.0
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: DEMO_PASSWORD_SEED
        sync: false
      - key: HOSTED_MANAGER_PASSWORD
        sync: false
      - key: HOSTED_TENANT_PASSWORD
        sync: false
